name: pr-title

# Pull request titles become the squash-merge commit, so they must be Conventional Commits:
# type(optional scope)!: description, e.g. "feat: share Wise Old Man pacing" or "fix(map): keep tiles cached".
on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|test|ci|refactor|perf|build|style|revert)(\([a-z0-9./_-]+\))?!?: [^ ].{2,}$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error title=PR title::\"$TITLE\" is not a Conventional Commit. Use type(scope): description, with type one of feat, fix, chore, docs, test, ci, refactor, perf, build, style or revert."
            exit 1
          fi
